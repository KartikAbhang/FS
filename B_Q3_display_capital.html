<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Display Capital</title>

<style>
body{font-family:Arial;margin:30px}
.blink{animation:blink 1s step-start infinite;color:#1f3a68}
@keyframes blink{50%{opacity:0}}
.capital{color:crimson;font-weight:bold;font-size:24px;margin-left:20px}
</style>
<script>
function show(){const s=document.getElementById('country');document.getElementById('cap').textContent=s.value;}
</script>
</head>
<body>

<h1 class="blink">Display Capital</h1>
<select id="country" size="5" onchange="show()">
 <option value="New Delhi">India</option>
 <option value="Washington, D.C.">USA</option>
 <option value="London">United Kingdom</option>
 <option value="Tokyo">Japan</option>
 <option value="Paris">France</option>
</select>
<span id="cap" class="capital"></span>

</body>
</html>
