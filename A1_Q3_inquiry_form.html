<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admission Inquiry Form</title>
<style>
body{font-family:Segoe UI,Arial,sans-serif;margin:0;background:#f4f6fa;color:#222}
header,footer{background:#1f3a68;color:#fff;padding:12px 20px}
nav a{color:#fff;margin-right:16px;text-decoration:none;font-weight:600}
nav a:hover{text-decoration:underline}
main{padding:20px;max-width:1000px;margin:auto}
table{border-collapse:collapse;width:100%;background:#fff}
th,td{border:1px solid #888;padding:8px;text-align:center}
th{background:#dde6f5}
caption{font-weight:bold;padding:8px}
label{display:block;margin-top:10px;font-weight:600}
input[type=text],input[type=number],textarea,select{padding:6px;width:100%;max-width:380px;box-sizing:border-box}
button,input[type=submit]{padding:8px 16px;margin-top:10px;cursor:pointer}
</style>

</head>
<body>
<main><h2>Student Registration / Inquiry</h2>
<form id="inq" onsubmit="event.preventDefault();alert('Inquiry submitted for '+this.sname.value);">
<fieldset><legend>Admission Inquiry</legend>
<label>Full Name <input type="text" name="sname" required></label>
<label>Email <input type="text" name="email" required></label>
<label>Phone <input type="text" name="phone"></label>
<label>Course</label>
<label><input type="radio" name="course" value="MSc CS" checked> M.Sc. Computer Science</label>
<label><input type="radio" name="course" value="MCA"> MCA</label>
<label><input type="radio" name="course" value="MSc IT"> M.Sc. IT</label>
<label>Elective Subjects</label>
<label><input type="checkbox" name="el" value="Cloud"> Cloud Computing</label>
<label><input type="checkbox" name="el" value="Crypto"> Cryptography</label>
<label><input type="checkbox" name="el" value="AI"> Artificial Intelligence</label>
<label>State
<select name="state"><option>Maharashtra</option><option>Gujarat</option><option>Karnataka</option><option>Goa</option><option>Other</option></select></label>
<label>Your Query <textarea name="query" rows="6"></textarea></label>
<input type="submit" value="Submit">
</fieldset></form>
</main>
</body>
</html>
