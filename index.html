<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSS Demo</title>

<link rel="stylesheet" href="style.css">
<style>.embedded{color:blue;font-size:18px;background:#e8f0ff;padding:6px}</style>
</head>
<body>

<h2>Cascading Style Sheets Demo</h2>
<p class="embedded">1. Embedded stylesheet: styled using the &lt;style&gt; tag in the head.</p>
<p class="external">2. External stylesheet: styled using style.css.</p>
<p style="color:red;font-weight:bold;font-size:22px">3. Inline style: styled using the style attribute.</p>

</body>
</html>
